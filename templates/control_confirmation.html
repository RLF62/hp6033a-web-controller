<label style="display:inline-flex;align-items:center;gap:.5em;min-height:40px;cursor:pointer">
  <input type="checkbox" id="skip-control-confirmations" autocomplete="off">
  Skip control confirmation popups
</label>
<script>
const confirmControl=(()=>{
 const checkbox=document.getElementById('skip-control-confirmations');
 const key='hp6033a.skipControlConfirmations';
 checkbox.checked=false;
 try{checkbox.checked=localStorage.getItem(key)==='true';}catch{}
 checkbox.addEventListener('change',()=>{
  try{localStorage.setItem(key,String(checkbox.checked));}catch{}
 });
 window.addEventListener('storage',event=>{
  if(event.key===key||event.key===null)checkbox.checked=event.newValue==='true';
 });
 return message=>checkbox.checked||window.confirm(message);
})();
</script>
