<button type="button" id="{{ field }}-visibility" aria-controls="{{ field }}" aria-label="Show password" aria-pressed="false" title="Show password">
 <svg width="22" height="16" viewBox="0 0 24 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
  <path d="M1 8s4-6 11-6 11 6 11 6-4 6-11 6S1 8 1 8Z"/>
  <circle cx="12" cy="8" r="2.5"/>
 </svg>
</button>
<script>
(()=>{
 const input=document.getElementById({{ field | tojson }});
 const button=document.getElementById(input.id+'-visibility');
 function setVisible(visible){
  input.type=visible?'text':'password';
  button.setAttribute('aria-pressed',String(visible));
  button.title=visible?'Hide password':'Show password';
 }
 button.addEventListener('click',()=>setVisible(input.type==='password'));
 input.closest('dialog').addEventListener('close',()=>{
  setVisible(false);
  input.value='';
 });
})();
</script>
